<div class="relative">
  <button
    type="button"
    class="flex items-center gap-3 rounded-lg px-1 py-1 transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0576CB] focus-visible:ring-offset-2"
    aria-label="Menu do usuário"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleMenu()"
  >
    <span class="flex h-10 w-10 items-center justify-center rounded-full bg-[#D8E4EC] text-xs font-semibold text-[#536A7A]">
      {{ userInitials() }}
    </span>

    <span class="text-left leading-tight">
      <span class="block text-xs font-semibold text-slate-900">
        @if (currentUser(); as user) {
          {{ user.name }}
        } @else {
          Usuário
        }
      </span>

      <span class="block text-xs text-[#536A7A]">
        {{ userProfileLabel() }}
      </span>
    </span>

    <svg
      aria-hidden="true"
      class="h-4 w-4 text-[#536A7A] transition"
      viewBox="0 0 24 24"
      fill="none"
      [class.rotate-180]="isOpen()"
    >
      <path
        d="M6 9L12 15L18 9"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  @if (isOpen()) {
    <section class="absolute right-0 top-12 z-50 w-64 rounded-xl border border-slate-200 bg-white shadow-[0_18px_50px_rgba(15,23,42,0.16)]">
      <header class="border-b border-slate-200 px-4 py-4">
        <p class="text-sm font-semibold text-slate-900">
          @if (currentUser(); as user) {
            {{ user.name }}
          } @else {
            Usuário
          }
        </p>

        <p class="mt-1 text-xs text-[#536A7A]">
          {{ userProfileLabel() }}
        </p>
      </header>

      <div class="p-2">
        <button
          type="button"
          class="flex w-full items-center rounded-lg px-3 py-2 text-left text-sm text-[#536A7A] transition hover:bg-[#F1F8FE] hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0576CB] focus-visible:ring-offset-2"
        >
          Minha conta
        </button>

        <button
          type="button"
          class="flex w-full items-center rounded-lg px-3 py-2 text-left text-sm text-[#536A7A] transition hover:bg-[#F1F8FE] hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0576CB] focus-visible:ring-offset-2"
          (click)="logout()"
        >
          Sair
        </button>
      </div>
    </section>
  }
</div>
