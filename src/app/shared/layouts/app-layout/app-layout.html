<div class="flex min-h-screen flex-col bg-[#F7FBFD] text-slate-900">
  <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/95 backdrop-blur">
    <div class="mx-auto flex h-16 w-full max-w-[1440px] items-center justify-between px-6 md:px-16">
      <div class="flex h-full items-center gap-[60px]">
        <img
          src="/logo-horizontal.png"
          alt="SterilFlow"
          class="h-auto w-[130px]"
        />

        <nav aria-label="Navegação principal" class="hidden h-full items-stretch gap-6 md:flex">
          <span class="flex h-full items-center border-b-[3px] border-[#0576CB] p-3 text-xs font-semibold text-[#0576CB]">
            Visão Geral
          </span>

          <span class="flex h-full items-center border-b-[3px] border-transparent p-3 text-xs font-medium text-[#536A7A]">
            Reservas
          </span>

          <span class="flex h-full items-center border-b-[3px] border-transparent p-3 text-xs font-medium text-[#536A7A]">
            Processos
          </span>

          <span class="flex h-full items-center border-b-[3px] border-transparent p-3 text-xs font-medium text-[#536A7A]">
            Materiais
          </span>
        </nav>
      </div>

      <div class="hidden items-center gap-6 md:flex">
        <app-notifications-button />
        <app-user-menu />
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-[1440px] flex-1 px-6 py-10">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200/80 bg-white/70">
    <div class="mx-auto flex min-h-12 w-full max-w-[1440px] items-center justify-between gap-4 px-6 text-xs text-slate-500 md:px-16">
      <span>SterilFlow · v1.0.0</span>
      <span class="hidden sm:inline">Processos mais seguros para uma saúde melhor.</span>
    </div>
  </footer>
</div>
